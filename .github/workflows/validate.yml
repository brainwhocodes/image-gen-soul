name: Validate skill
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s scripts -p "test_*.py"
  skills-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Discover the complete skill package
        run: npx --yes skills@1.5.26 add . --list
      - name: Install into a temporary project and check bundled guides
        shell: bash
        run: |
          source_dir="$GITHUB_WORKSPACE"
          test_dir="$(mktemp -d "$RUNNER_TEMP/soul-install.XXXXXX")"
          cd "$test_dir"
          npx --yes skills@1.5.26 add "$source_dir" --skill image-gen-soul --agent codex --copy --yes
          python .agents/skills/image-gen-soul/scripts/validate_skill.py
      - name: Check the bundled writing patterns
        run: node scripts/writing/cliche-lint.mjs --self-test
